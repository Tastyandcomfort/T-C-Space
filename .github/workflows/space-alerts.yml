name: Space Hub Alerts Engine

on:
  workflow_dispatch: # Allows cron-job.org to trigger this alert

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install firebase-admin node-fetch@2

      - name: Run Space Alert Dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY || 'DEMO_KEY' }}
        run: node scripts/send-space-alerts.js
